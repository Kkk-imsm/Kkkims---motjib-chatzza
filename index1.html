<title>CIRCLE 맛집 기록 커뮤니티</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 카페형 2단 (왼쪽 카페 정보·게시판 메뉴 / 오른쪽 본문), 폰에서는 메뉴가 가로 칩으로 접힘 */
:root{
  --bg:#faf8f4; --surface:#ffffff; --ink:#141414; --ink-soft:#726c64; --line:#e9e4dc;
  --chip:#f2eee7; --accent:#ff5a3c; --accent-ink:#ffffff; --accent-soft:#ffebe5; --good:#2c8a57; --good-soft:#e3f3ea;
  --f-display:'Black Han Sans','Gothic A1','Apple SD Gothic Neo',sans-serif;
  --f-body:'Gothic A1','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15120f; --surface:#1e1a16; --ink:#f3eee6; --ink-soft:#a59c90; --line:#342e27;
  --chip:#2a251f; --accent:#ff6f54; --accent-ink:#1a0d08; --accent-soft:#3a2018; --good:#5cc08a; --good-soft:#1c3327; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15120f; --surface:#1e1a16; --ink:#f3eee6; --ink-soft:#a59c90; --line:#342e27;
  --chip:#2a251f; --accent:#ff6f54; --accent-ink:#1a0d08; --accent-soft:#3a2018; --good:#5cc08a; --good-soft:#1c3327; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;word-break:keep-all}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.wrap{max-width:1160px;margin:0 auto;padding-inline:16px}

/* top notice */
.proto{background:var(--ink);color:var(--bg);font-size:12.5px;text-align:center;padding:6px 16px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;height:62px}
.logo{display:flex;align-items:baseline;gap:8px;flex-shrink:0}
.logo b{font-family:var(--f-display);font-weight:400;font-size:26px;letter-spacing:.02em;color:var(--accent)}
.logo span{font-size:12px;color:var(--ink-soft)}
.search{flex:1;min-width:0;display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 6px 0 16px;height:40px;max-width:460px}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none}
.search button{border:0;background:transparent;padding:6px 8px;color:var(--ink-soft)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.icon-btn{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:8px 16px;font-weight:700;font-size:14px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex-shrink:0}

/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:28px;padding-block:24px 64px}
aside.side{display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px);align-self:start}
.cafe-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.cafe-box h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px}
.cafe-box p{margin:0;font-size:13px;color:var(--ink-soft)}
.me{display:flex;align-items:center;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.me div{font-size:13px;line-height:1.4}
.me small{color:var(--ink-soft)}
.menu{display:flex;flex-direction:column;gap:2px}
.menu h3{margin:14px 0 4px;font-size:11.5px;letter-spacing:.08em;color:var(--ink-soft);font-weight:700}
.menu h3:first-child{margin-top:0}
.menu a{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-radius:8px;font-size:14px}
.menu a:hover{background:var(--chip)}
.menu a.cur{background:var(--accent-soft);color:var(--accent);font-weight:700}
.menu a .n{font-size:11px;color:var(--ink-soft)}
.menu a.cur .n{color:var(--accent)}
.chips-mobile{display:none}

main{min-width:0}
.page{display:flex;flex-direction:column;gap:28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-h h2{margin:0;font-size:19px;font-weight:800;text-wrap:balance}
.sec-h a{font-size:13px;color:var(--ink-soft)}
.sec-h small{color:var(--ink-soft);font-size:13px}

/* home intro */
.intro{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end;padding:22px 24px;border-radius:var(--r);background:var(--ink);color:var(--bg)}
.intro h1{margin:0 0 6px;font-family:var(--f-display);font-weight:400;font-size:clamp(24px,3.4vw,34px);line-height:1.2;text-wrap:balance}
.intro p{margin:0;font-size:14px;opacity:.75;max-width:52ch}
.intro .btn.primary{color:var(--accent-ink)}

/* ranked list */
.rank{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rank a{display:grid;grid-template-columns:34px 64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.rank a:first-child{border-top:0}
.rank a:hover{background:var(--chip)}
.rank .no{font-family:var(--f-num);font-weight:600;font-size:18px;color:var(--ink-soft);text-align:center}
.rank a:nth-child(-n+3) .no{color:var(--accent)}
.rank img{width:64px;height:64px;border-radius:8px;object-fit:cover;display:block}
.rank .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.meta{font-size:12.5px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.up{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--ink-soft);min-width:44px}
.up b{font-family:var(--f-num);font-size:16px;color:var(--accent)}

/* tags / chips */
.tag{display:inline-flex;align-items:center;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--ink-soft);white-space:nowrap}
.tag.with{background:var(--accent-soft);color:var(--accent);font-weight:700}
.tag.ok{background:var(--good-soft);color:var(--good);font-weight:700}
.head{font-weight:700;color:var(--accent);margin-right:4px}
.chiprow{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13.5px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* photo grid */
.pgrid{columns:3 220px;column-gap:14px}
.pcard{break-inside:avoid;margin-bottom:14px;display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pcard .ph{position:relative}
.pcard img{display:block;width:100%;object-fit:cover}
.pcard .ph .tag{position:absolute;left:10px;top:10px;background:rgba(20,20,20,.72);color:#fff}
.pcard .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.pcard .t{font-weight:700;line-height:1.45}
.pcard .who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft)}
.pcard .who .avatar{width:22px;height:22px;font-size:10px}
.pcard .stats{margin-left:auto;display:flex;gap:10px}
.pcard .score{font-family:var(--f-num);font-weight:600;color:var(--accent);font-size:13px}

/* curation */
.cur-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.coll{display:flex;flex-direction:column;gap:10px}
.coll .collage{display:grid;grid-template-columns:1fr 1fr;gap:3px;border-radius:var(--r);overflow:hidden;aspect-ratio:1;max-width:100%}
.coll .collage img{width:100%;height:100%;object-fit:cover;display:block}
.coll b{font-size:15px}
.coll small{color:var(--ink-soft);font-size:12.5px;display:block}

.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px}
.simple{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.simple a{display:flex;gap:10px;align-items:baseline;justify-content:space-between;padding:11px 16px;border-top:1px solid var(--line);font-size:14px}
.simple a:first-child{border-top:0}
.simple a:hover{background:var(--chip)}
.simple a span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.simple .c{color:var(--accent);font-weight:700;font-size:12.5px;margin-left:4px}
.reviewers{display:flex;flex-direction:column}
.rv{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line)}
.rv:first-child{border-top:0}
.rv .info{flex:1;min-width:0;font-size:13px;line-height:1.4}
.rv .info b{font-size:14px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:4px;border:1px solid var(--accent);color:var(--accent);margin-left:4px;vertical-align:1px}
.lv{font-size:11px;color:var(--ink-soft)}

/* board */
.board-h{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:14px}
.board-h h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1}
.board-h p{margin:4px 0 0;color:var(--ink-soft);font-size:13.5px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 14px;font-size:13.5px}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:700}
.filter{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink-soft)}
.tbl-wrap{overflow-x:auto;border-top:1px solid var(--line)}
table.list{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
.list th{font-size:12px;font-weight:700;color:var(--ink-soft);padding:10px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.list td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;color:var(--ink-soft);font-size:13px}
.list td.title{text-align:left;white-space:normal;color:var(--ink);font-size:14.5px}
.list tr.row{cursor:pointer}
.list tr.row:hover td{background:var(--chip)}
.list tr.notice td{background:var(--accent-soft)}
.list .ic{display:inline-block;margin-left:6px;font-size:11px;color:var(--ink-soft);vertical-align:1px}
.list .cm{color:var(--accent);font-weight:700;font-size:12.5px;margin-left:4px}
.list td.num{font-family:var(--f-num)}
.list .hot{color:var(--accent);font-weight:700}
.pager{display:flex;justify-content:center;gap:4px;padding-top:8px}
.pager button{min-width:34px;height:34px;border-radius:8px;border:1px solid transparent;background:transparent;font-family:var(--f-num)}
.pager button.on{border-color:var(--ink);font-weight:700}
.empty{padding:48px 16px;text-align:center;color:var(--ink-soft)}

/* post */
.crumb{font-size:13px;color:var(--ink-soft);display:flex;gap:6px;flex-wrap:wrap}
.crumb a:hover{color:var(--accent)}
.post-h{display:flex;flex-direction:column;gap:12px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.post-h h1{margin:0;font-size:clamp(22px,3vw,28px);line-height:1.35;font-weight:800;text-wrap:balance}
.author{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.author .avatar{width:42px;height:42px;font-size:15px}
.author .who{line-height:1.35;font-size:14px}
.author .who small{color:var(--ink-soft);font-size:12.5px}
.author .follow{margin-left:auto}
.info-card{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.info-card > div{padding:18px 20px;min-width:0}
.info-card > div + div{border-left:1px solid var(--line)}
.shop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}
.shop h2{margin:0;font-size:20px;font-weight:800}
.shop p{margin:2px 0 0;font-size:13px;color:var(--ink-soft)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 16px;margin:0;font-size:14px}
.kv dt{color:var(--ink-soft);font-size:13px}
.kv dd{margin:0;font-weight:500}
.total{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.total b{font-family:var(--f-num);font-size:38px;line-height:1;color:var(--accent)}
.total span{color:var(--ink-soft);font-size:13px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:62px minmax(0,1fr) 32px;gap:10px;align-items:center;font-size:13px}
.bar i{display:block;height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.bar i em{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar .num{text-align:right;font-weight:600}
.menus{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.menus h3{margin:0;padding:12px 18px;font-size:14px;border-bottom:1px solid var(--line)}
.menu-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:11px 18px;border-top:1px solid var(--line)}
.menus h3 + .menu-row{border-top:0}
.menu-row b{font-size:14.5px}
.menu-row .num{text-align:right;font-weight:600}
.menu-row p{grid-column:1/-1;margin:0;font-size:13px;color:var(--ink-soft)}
.gallery{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:6px;border-radius:var(--r);overflow:hidden;aspect-ratio:3/2;max-width:100%}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.gallery img:first-child{grid-row:1/3}
.gallery.one{grid-template-columns:1fr;grid-template-rows:1fr}
.gallery.one img:first-child{grid-row:auto}
.content{font-size:16px;line-height:1.85;max-width:68ch}
.content p{margin:0 0 1em}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tags span{color:var(--accent);font-size:14px}
.vote{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.vote .big{flex-direction:column;gap:0;width:96px;height:76px;border-radius:14px;font-weight:700}
.vote .big b{font-family:var(--f-num);font-size:20px}
.vote .big.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.notice-box{font-size:13px;color:var(--ink-soft);background:var(--chip);border-radius:8px;padding:10px 14px}

.comments h2{font-size:17px;margin:0 0 6px}
.cmt{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.cmt.re{padding-left:44px}
.cmt .avatar{width:32px;height:32px;font-size:12px}
.cmt .c-body{flex:1;min-width:0;font-size:14.5px}
.cmt .c-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.cmt .c-top small{color:var(--ink-soft)}
.cmt p{margin:3px 0 4px}
.cmt .c-act{font-size:12.5px;color:var(--ink-soft);display:flex;gap:12px}
.cmt .c-act button{border:0;background:transparent;padding:0;color:inherit}
.is-writer{font-size:11px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 5px}
.cmt-form{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 14px;margin-top:8px}
.cmt-form textarea{border:0;background:transparent;resize:vertical;min-height:60px;outline:none}
.cmt-form div{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink-soft)}

.same{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.same a{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.same img{width:52px;height:52px;border-radius:6px;object-fit:cover}
.same div{min-width:0;font-size:13px;line-height:1.4}
.same b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* write */
.form{display:flex;flex-direction:column;gap:22px}
.fs{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px}
.fs > h2{margin:0;font-size:16px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fs > h2 small{font-weight:400;color:var(--ink-soft);font-size:12.5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label,.field > .lbl{font-size:13px;font-weight:700}
.field input[type=text],.field input[type=email],.field input[type=password],.field input[type=date],.field input[type=number],.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:10px 12px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{min-height:220px;resize:vertical;line-height:1.7}
.title-input{font-size:20px !important;font-weight:700}
.shop-pick{position:relative}
.sugg{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;z-index:5;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.sugg button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;font-size:14px}
.sugg button:hover{background:var(--chip)}
.sugg small{color:var(--ink-soft);margin-left:6px}
.picked{display:flex;align-items:center;gap:8px;font-size:13.5px;background:var(--accent-soft);color:var(--accent);padding:8px 12px;border-radius:8px;font-weight:700}
.mrow{display:grid;grid-template-columns:minmax(0,1.2fr) 110px minmax(0,2fr) 34px;gap:8px;align-items:center}
.mrow input{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 10px;outline:none;min-width:0}
.mrow .x{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink-soft)}
.stars-row{display:grid;grid-template-columns:76px auto 40px;gap:12px;align-items:center}
.stars{display:flex;gap:2px}
.stars button{border:0;background:transparent;padding:0 1px;font-size:24px;line-height:1;color:var(--line)}
.stars button.on{color:var(--accent)}
.stars-row .num{font-weight:600;color:var(--accent)}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;color:var(--ink-soft);font-size:13.5px;display:flex;flex-direction:column;gap:12px;align-items:center}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:8px}
.check{display:flex;align-items:flex-start;gap:8px;font-size:14px}
.check input{margin-top:5px;accent-color:var(--accent)}
.submit-bar{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.submit-bar small{margin-right:auto;color:var(--ink-soft)}

/* ---------- 상태 · 유틸 ---------- */
const S={board:'all',view:'list',sort:'new',w:'전체',page:1,q:'',voted:{},scrap:{},follow:{},extraCmt:{},lastPage:'home',barClosed:false};

/* 사회적 증거: 예시 숫자 (실서비스에서는 DB 집계값으로 교체) */
function stat(key,min,max){return Math.round(min+rng(hstr(String(key)))()*(max-min))}
const LIVE={writers:stat('w',9,16),today:stat('t',72,110),places:stat('p',28,41),joined:stat('j',380,460)};
const ACTS=[];
function buildActs(){const rv=POSTS.filter(p=>p.shop);const names=Object.keys(USERS).filter(n=>n!=='운영진');
  for(let i=0;i<14;i++){const p=rv[(i*5)%rv.length],n=names[(i*7+3)%names.length];if(n===p.au)continue;
    ACTS.push([`${n}님이 가고 싶은 곳에 <b>${esc(p.shop.name)}</b> 추가`,`${n}님이 <b>${esc(p.shop.name)}</b> 리뷰에 추천`,`${n}님이 <b>${esc(p.shop.area.split(' ').slice(-1)[0])}</b> 리뷰를 읽는 중`][i%3])}}
const watching=p=>stat('v'+p.id,3,4+Math.round(p.up/12));
const wishCount=p=>stat('s'+p.id,Math.round(p.up*.3),Math.round(p.up*.6)+4)+(S.scrap[p.id]?1:0);
const guestN=()=>({scrap:Object.values(S.scrap).filter(Boolean).length,vote:Object.values(S.voted).filter(Boolean).length,follow:Object.values(S.follow).filter(Boolean).length});
function afterAuthMerge(){const g=guestN(),n=AUTH.mode==='supabase'?(AUTH.merged||0):g.scrap+g.vote+g.follow;AUTH.merged=0;if(n)setTimeout(()=>toast(`비회원일 때 담아 둔 ${n}개를 내 계정에 저장했어요`),1300)}
/* 비회원 무료 열람: 리뷰 2개는 전부 공개 */
const FREE_N=2;
function canRead(p){if(AUTH.user||!p.shop)return {full:true};const f=demoLoad('circle-free')||[];
  if(f.includes(p.id))return {full:true,free:f.indexOf(p.id)+1};
  if(f.length<FREE_N){f.push(p.id);demoSave('circle-free',f);return {full:true,free:f.length}}
  return {full:false}}
function kst(iso){const d=new Date(new Date(iso).getTime()+9*3600e3).toISOString();return d.slice(0,10)+' '+d.slice(11,16)}  /* 한국 시간 'YYYY-MM-DD HH:MM' */
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=n=>n.toLocaleString('ko-KR')+'원';
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
const cmCount=p=>p.cmts?p.cmts.reduce((n,c)=>n+1+c.re.length,0):p.cm!=null?p.cm:(p.id*7%23)+4+(CMT_SPECIFIC[p.id]?0:0);
function ddate(d){const [day,t]=d.split(' ');if(day===TODAY)return t;return day.slice(5).replace('-','.')}
function user(n){return USERS[n]||{c:'#888',lv:'새싹'}}
function av(n,size){const u=user(n);return `<span class="avatar" style="background:${u.c}${size?';width:'+size+'px;height:'+size+'px':''}">${esc(n[0])}</span>`}
function boardOf(id){return BOARDS.find(b=>b.id===id)}
function photo(p,i=0){if(p.photos&&p.photos[i])return p.photos[i];return food(p.img||'gukbap',(p.seed||p.id)+i*13)}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>el.hidden=true,2200)}
function inBoard(p,id){const b=boardOf(id);if(!b)return true;if(id==='all')return p.b!=='notice';if(id==='best')return p.up>=50&&p.b!=='notice';if(b.cat)return p.cat===b.cat;return p.b===id}

/* ---------- 내비게이션 ---------- */
function renderNav(cur){
  let html='',g='';
  BOARDS.forEach(b=>{if(b.g!==g){g=b.g;if(g!=='main')html+=`<h3>${g}</h3>`}
    const n=b.id==='home'?'':POSTS.filter(p=>inBoard(p,b.id)).length;
    html+=`<a href="#${b.id==='home'?'home':'b-'+b.id}" class="${cur===b.id?'cur':''}"><span>${b.name}</span><span class="n num">${n}</span></a>`});
  $('#snav').innerHTML=html;
  $('#mnav').innerHTML=BOARDS.map(b=>`<a class="chip ${cur===b.id?'on':''}" href="#${b.id==='home'?'home':'b-'+b.id}">${b.name}</a>`).join('');
}

  <div class="body"><div class="t">${esc(p.title)}</div>${p.shop?`<div class="meta"><span>${esc(p.shop.name)}</span><span>${esc(p.shop.area.split(' ').slice(1).join(' '))}</span></div>`:''}
  <div class="who">${av(p.au)}<span>${esc(p.au)}</span><span class="stats">${s?`<span class="score">★ ${s}</span>`:''}<span class="upc">추천 <b class="num">${p.up+(S.voted[p.id]?1:0)}</b></span></span></div></div></a><button type="button" class="pin ${S.scrap[p.id]?'on':''}" data-scrap="${p.id}" aria-label="가고 싶은 곳에 담기" aria-pressed="${!!S.scrap[p.id]}">${S.scrap[p.id]?'★':'☆'}</button></div>`}

    <div class="live-line"><span class="pulse"></span><span>지금 <b id="live-writers">${LIVE.writers}</b>명이 리뷰를 쓰는 중 · 오늘 <b>${LIVE.today}</b>명이 <b>${LIVE.places}</b>곳을 기록했어요</span></div>
    <div class="ticker" id="ticker" aria-live="off">${ACTS[0]||''}</div></div><a class="btn primary" href="#write">첫 리뷰 쓰기</a></section>

    <div class="rank">${best.map((p,i)=>`<a href="#post-${p.id}"><span class="no">${i+1}</span><img src="${photo(p)}" alt=""><div style="min-width:0"><div class="t">${p.head?`<span class="head">[${p.head}]</span>`:''}${esc(p.title)} <span class="c" style="color:var(--accent);font-size:13px">[${cmCount(p)}]</span></div><div class="meta"><span>${esc(boardOf(p.b).name)}</span><span>${esc(p.au)}</span>${p.w?`<span class="tag with">${p.w}</span>`:''}</div></div><span class="up"><b>${p.up}</b>추천</span></a>`).join('')}</div></section>

/* ---------- 게시판 ---------- */
function board(){

  if(S.w!=='전체')list=list.filter(p=>p.w===S.w);
  const key={new:(a,b)=>b.d.localeCompare(a.d),up:(a,b)=>b.up-a.up,cm:(a,b)=>cmCount(b)-cmCount(a),score:(a,b)=>(b.sc?avg(b.sc):0)-(a.sc?avg(a.sc):0)}[S.sort];
  list=[...list].sort(key);

  return `<div class="page">

  <div class="toolbar"><div class="seg" role="group" aria-label="보기 방식"><button type="button" data-view="list" class="${S.view==='list'?'on':''}">목록형</button><button type="button" data-view="photo" class="${S.view==='photo'?'on':''}">사진형</button></div>
    <div class="seg" role="group" aria-label="정렬">${[['new','최신순'],['up','추천순'],['cm','댓글순'],['score','평점순']].map(([k,l])=>`<button type="button" data-sort="${k}" class="${S.sort===k?'on':''}">${l}</button>`).join('')}</div></div>
  <div class="filter"><span>누구와 갔나</span>${withs.map(w=>`<button class="chip ${S.w===w?'on':''}" type="button" data-with="${w}">${w}</button>`).join('')}</div>
  ${list.length===0?`<div class="empty">조건에 맞는 글이 아직 없어요. 첫 리뷰를 남겨 보세요.<br><br><a class="btn primary" href="#write">리뷰 쓰기</a></div>`:
  S.view==='photo'?`<div class="pgrid">${list.map((p,i)=>p.img||p.photos?pcard(p,i%3===0?'4/5':'1'):'').join('')}</div>`:

function stars(v){return `<span class="num">${v.toFixed(1)}</span>`}
function comments(p,limit){
  let list=p.cmts||CMT_SPECIFIC[p.id];
  if(!list){const R=rng(p.id*31);const n=Math.min(4,cmCount(p));list=[];const pool=Object.keys(USERS).filter(n=>n!==p.au&&n!=='운영진');for(let i=0;i<n;i++){list.push({au:pool[Math.floor(R()*pool.length)],t:CMT_POOL[Math.floor(R()*CMT_POOL.length)],d:`${String(8+i*3).padStart(2,'0')}:${String(Math.floor(R()*60)).padStart(2,'0')}`,up:Math.floor(R()*9)})}
    if(list[0]&&p.shop)list[0].re=[{au:p.au,t:'감사합니다! 궁금한 점 있으면 편하게 물어보세요.',d:'12:30'}]}
  list=list.concat(S.extraCmt[p.id]||[]);if(limit)list=list.slice(0,limit);
  const one=(c,re)=>`<div class="cmt ${re?'re':''}">${av(c.au)}<div class="c-body"><div class="c-top"><b>${esc(c.au)}</b>${c.au===p.au?'<span class="is-writer">작성자</span>':''}<small class="num">${c.d}</small></div><p>${esc(c.t)}</p>${re?'':`<div class="c-act"><button type="button" data-reply>답글</button><button type="button" data-cup>추천 <span class="num">${c.up||0}</span></button></div>`}</div></div>`;
  return list.map(c=>one(c)+(c.re||[]).map(r=>one(r,true)).join('')).join('');
}

/* ---------- Supabase 연결: 교안 방식 (라이브러리 없이 fetch) ----------
   /rest/v1/…  표 읽기·쓰기      /auth/v1/…  가입·로그인·토큰
   요청 헤더: apikey = 공개 키, 로그인한 뒤에는 Authorization: Bearer <JWT> 추가 */
const AUTH={mode:'demo',session:null,user:null,after:null};
const DB_ON=!!(SUPABASE_URL&&SUPABASE_KEY);
const SESSION_KEY='circle.session',CACHE_KEY='circle.posts';
const MEM={};
function demoLoad(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return MEM[k]||null}}
function demoSave(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){MEM[k]=v}}
async function sha(t){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'p:'+t}}
function profileFrom(u){const m=u.user_metadata||{};return {id:u.id,email:u.email||'',nickname:m.nickname||m.name||(u.email||'회원').split('@')[0],regions:m.regions||[],foods:m.foods||[],provider:(u.app_metadata&&u.app_metadata.provider)||'email',created:(u.created_at||'').slice(0,10)}}
function setUser(p){AUTH.user=p;if(p&&!USERS[p.nickname])USERS[p.nickname]={c:'#ff5a3c',lv:'새싹'}}
function koErr(m=''){
  if(/Invalid login credentials/i.test(m))return '이메일 또는 비밀번호가 맞지 않아요.';
  if(/Email not confirmed/i.test(m))return '메일함에서 인증 링크를 먼저 눌러 주세요.';
  if(/already registered|already exists/i.test(m))return '이미 가입된 이메일이에요. 로그인해 주세요.';
  if(/Password should be at least/i.test(m))return '비밀번호는 6자 이상이어야 해요.';
  if(/rate limit|too many/i.test(m))return '요청이 너무 잦아요. 잠시 후 다시 시도해 주세요.';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return 'Supabase에 연결하지 못했어요. 주소와 키, 인터넷 연결을 확인해 주세요.';
  if(/provider is not enabled|Unsupported provider/i.test(m))return 'Supabase 대시보드에서 이 로그인 방식이 아직 켜져 있지 않아요.';
  if(/Invalid API key|No API key/i.test(m))return '공개 키가 맞지 않아요. Connect 화면의 sb_publishable_ 키를 다시 복사해 주세요.';
  if(/row-level security|permission denied/i.test(m))return '권한이 없어요. 다시 로그인해 주세요.';
  return m||'알 수 없는 오류가 났어요.';
}
/* 공통 요청 함수: 실패하면 서버 메시지를 담아 throw */
async function sb(path,{method='GET',body,auth=false,prefer}={}){
  const h={apikey:SUPABASE_KEY,'Content-Type':'application/json'};
  if(auth){const t=await freshToken();if(!t)throw new Error('로그인이 필요해요.');h.Authorization='Bearer '+t}
  if(prefer)h.Prefer=prefer;
  const r=await fetch(SUPABASE_URL+path,{method,headers:h,body:body==null?undefined:JSON.stringify(body)});
  const txt=await r.text();let data=null;try{data=txt?JSON.parse(txt):null}catch(e){data=txt}
  if(!r.ok){const m=data&&(data.msg||data.message||data.error_description||data.error)||('HTTP '+r.status);const e=new Error(m);e.status=r.status;throw e}
  return data;
}
/* 세션(JWT) 보관과 갱신: 만료 1분 전일 때만 새로 받음 (주기적 요청 없음) */
function saveSession(s){if(s&&!s.expires_at&&s.expires_in)s.expires_at=Math.floor(Date.now()/1000)+s.expires_in;AUTH.session=s;demoSave(SESSION_KEY,s);setUser(s&&s.user?profileFrom(s.user):null)}
async function freshToken(){
  const s=AUTH.session;if(!s)return null;
  if(s.expires_at*1000-Date.now()>60000)return s.access_token;
  try{saveSession(await sb('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:s.refresh_token}}));return AUTH.session.access_token}
  catch(e){saveSession(null);return null}
}
async function initAuth(){
  if(!DB_ON){setUser(demoLoad('circle-session'));return}
  AUTH.mode='supabase';
  /* 카카오·구글 로그인이나 메일 인증 링크에서 돌아오면 주소 # 뒤에 토큰이 붙어 옴 */
  const hp=new URLSearchParams(location.hash.slice(1));
  if(hp.get('access_token')){
    const s={access_token:hp.get('access_token'),refresh_token:hp.get('refresh_token'),expires_in:+hp.get('expires_in')||3600};
    try{AUTH.session=s;s.user=await sb('/auth/v1/user',{auth:true});saveSession(s);AUTH.justIn=true}catch(e){saveSession(null)}
    history.replaceState(null,'',location.pathname+location.search+'#home');
  }else{
    const s=demoLoad(SESSION_KEY);if(s){AUTH.session=s;if(await freshToken())setUser(profileFrom(AUTH.session.user));else saveSession(null)}
  }
}
async function signUp(f){
  if(AUTH.mode==='supabase'){
    try{const r=await sb('/auth/v1/signup?redirect_to='+encodeURIComponent(location.href.split('#')[0]),{method:'POST',body:{email:f.email,password:f.password,data:{nickname:f.nickname,regions:f.regions,foods:f.foods,marketing:f.marketing}}});
      if(r&&r.access_token){saveSession(r);await loadMine();return {}}
      return {needVerify:true};          /* Confirm email 이 켜져 있으면 세션 없이 메일만 감 */
    }catch(e){return {error:koErr(e.message)}}
  }
  const users=demoLoad('circle-users')||{};
  if(users[f.email])return {error:'이미 가입된 이메일이에요. 로그인해 주세요.'};
  if(Object.values(users).some(u=>u.profile.nickname===f.nickname)||USERS[f.nickname])return {error:'이미 쓰는 닉네임이에요. 다른 닉네임을 골라 주세요.',field:'su-nick'};
  const profile={id:'demo-'+Date.now(),email:f.email,nickname:f.nickname,regions:f.regions,foods:f.foods,provider:'email',created:new Date().toISOString().slice(0,10)};
  users[f.email]={hash:await sha(f.password),profile};demoSave('circle-users',users);demoSave('circle-session',profile);setUser(profile);
  return {};
}
async function signIn(email,password){
  if(AUTH.mode==='supabase'){
    try{saveSession(await sb('/auth/v1/token?grant_type=password',{method:'POST',body:{email,password}}));await loadMine();return {}}
    catch(e){return {error:koErr(e.message)}}
  }
  const u=(demoLoad('circle-users')||{})[email];

function fromRow(r){

/* 내 추천·스크랩·팔로우 (JWT를 붙여야 내 행만 돌아옴) */
let MINE_UP={};
function restoreUp(){Object.keys(MINE_UP).forEach(id=>{const p=POSTS.find(x=>x.id===+id);if(p)p.up+=1});MINE_UP={}}
async function loadMine(){
  if(AUTH.mode!=='supabase'||!AUTH.user)return;
  try{
    const [v,s,f]=await Promise.all(['/rest/v1/votes?select=post_id','/rest/v1/scraps?select=post_id','/rest/v1/follows?select=nick'].map(u=>sb(u,{auth:true})));
    const guest={voted:S.voted,scrap:S.scrap,follow:S.follow};
    restoreUp();S.voted={};S.scrap={};S.follow={};
    /* posts.up 에는 내 추천도 들어 있으니, 화면에서 +1 하는 방식과 맞추려고 한 번 빼 둠 */
    v.forEach(r=>{S.voted[r.post_id]=true;MINE_UP[r.post_id]=1;const p=POSTS.find(x=>x.id===r.post_id);if(p)p.up=Math.max(0,p.up-1)});
    s.forEach(r=>S.scrap[r.post_id]=true);f.forEach(r=>S.follow[r.nick]=true);
    /* 비회원일 때 담아 둔 것을 계정에 저장 */
    AUTH.merged=0;
    const add=(tbl,obj,key,row)=>Object.keys(obj).filter(k=>obj[k]&&!S[key][k]).map(k=>sb('/rest/v1/'+tbl,{method:'POST',auth:true,prefer:'resolution=ignore-duplicates,return=minimal',body:row(k)}).then(()=>{S[key][k]=true;AUTH.merged++;if(tbl==='votes')MINE_UP[k]=1}).catch(()=>{}));
    await Promise.all([...add('votes',guest.voted,'voted',k=>({post_id:+k})),...add('scraps',guest.scrap,'scrap',k=>({post_id:+k})),...add('follows',guest.follow,'follow',k=>({nick:k}))]);
  }catch(e){}
}
/* 추천·스크랩·팔로우 누르기: 로그인했으면 DB에 넣고 빼기 */
async function toggleRow(tbl,key,id,row){

}

function route(){
  const h=location.hash.slice(1)||'home';let html,cur='home';
  if(!['login','signup','verify','me'].includes(h))S.lastPage=h;
  if(h.startsWith('post-')){html=post(+h.slice(5));const p=POSTS.find(x=>x.id===+h.slice(5));cur=p?p.b:''}
  else if(h.startsWith('b-')){const id=h.slice(2);if(S.board!==id){S.board=id;S.w='전체'}cur=id;html=board()}
  else if(h==='write'){cur='';if(!AUTH.user){AUTH.after='write';AUTH.msg='리뷰를 쓰려면 로그인해 주세요.';html=loginPage()}else html=write()}
  else if(h==='login'){cur='';html=AUTH.user?mePage():loginPage()}
  else if(h==='signup'){cur='';html=signupPage()}
  else if(h==='verify'){cur='';html=verifyPage()}
  else if(h==='me'){cur='';html=mePage()}
  else if(h==='search'){cur='';S.board='search';html=board()}
  else html=home();
  renderNav(cur);renderAuthUI();$('#app').innerHTML=html;
}
function render(){route()}
function go(h){if(location.hash==='#'+h)route();else location.hash=h;window.scrollTo(0,0)}

  else if(d.follow){const n=d.follow;toggleRow('follows','follow',n,{nick:n}).then(on=>toast(on?n+'님을 팔로우해요. 새 글이 피드에 떠요':'팔로우를 취소했어요'))}

  else if(t.id==='logout'){signOut().then(()=>{go('home');toast('로그아웃했어요')})}
  else if(t.id==='bar-x'){S.barClosed=true;renderAuthUI()}
  else if(t.id==='bell')toast('새 알림 3개: 댓글 2, 추천 1');
  else if(d.wtype){keepFields(()=>{W.type=d.wtype})}
  else if(d.ww){keepFields(()=>{W.w=d.ww})}
  else if(d.star){const [i,n]=d.star.split('-').map(Number);keepFields(()=>{W.sc[i]=n})}
  else if(t.id==='madd'){keepFields(()=>{W.menus.push(['','',''])})}

  else if(d.pick){keepFields(()=>{W.shop=SHOPS[+d.pick]})}

  else if(t.id==='load-draft'){try{const v=JSON.parse(localStorage.getItem('circle-draft'));$('#w-title').value=v.title;$('#w-body').value=v.body;$('#draft-box').hidden=true}catch(err){}}
